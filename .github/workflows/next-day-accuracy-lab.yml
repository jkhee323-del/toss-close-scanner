name: Next-day accuracy lab

on:
  push:
    branches: [accuracy-lab]
    paths:
      - "src/next_day_validation_feature_models.py"
      - "src/next_day_candidate_holdout.py"
      - "src/next_day_flow_retrospective.py"
      - "src/next_day_market_liquidity_diagnostics.py"
      - "src/next_day_fixed_strategy_audit.py"
      - "src/next_day_walkforward_search.py"
      - "src/indicators.py"
      - "src/swing_horizon_models.py"
      - "tests/test_obv_indicators.py"
      - "tests/test_obv_swing_data.py"
      - ".github/workflows/next-day-accuracy-lab.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run OBV and swing data regression tests
        run: python -m unittest discover -s tests -p "test_obv*.py" -v
      - name: Run walk-forward candidate search
        run: python -m src.next_day_walkforward_search
      - name: Run validation experiment
        run: python -m src.next_day_validation_feature_models
      - name: Compare 3 5 10 day baseline vs OBV
        run: python -m src.swing_horizon_models
      - name: Compare 2025-2026 next-day flow model retrospectively
        run: python -m src.next_day_flow_retrospective
      - name: Diagnose market regimes and liquidity thresholds
        run: python -m src.next_day_market_liquidity_diagnostics
      - name: Audit fixed strategy costs and drawdowns
        run: python -m src.next_day_fixed_strategy_audit
      - name: Run fixed candidate holdout
        run: python -m src.next_day_candidate_holdout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-day-validation-results
          path: |
            data/experiments/validation_feature_model_comparison.csv
            data/experiments/validation_feature_model_comparison.json
            data/experiments/next_day_walkforward_search.csv
            data/experiments/swing_horizon_obv_comparison.csv
            data/experiments/next_day_flow_2025_2026_retrospective.csv
            data/experiments/next_day_market_liquidity_diagnostics.csv
            data/experiments/next_day_fixed_strategy_audit.csv
            data/experiments/next_day_fixed_strategy_daily.csv
