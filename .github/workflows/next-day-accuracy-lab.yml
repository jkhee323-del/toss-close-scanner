name: Next-day accuracy lab

on:
  push:
    branches: [accuracy-lab]
    paths:
      - "src/next_day_validation_feature_models.py"
      - "src/next_day_candidate_holdout.py"
      - ".github/workflows/next-day-accuracy-lab.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run walk-forward candidate search
        run: python -m src.next_day_walkforward_search
      - name: Run validation experiment
        run: python -m src.next_day_validation_feature_models
      - name: Run fixed candidate holdout
        run: python -m src.next_day_candidate_holdout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-day-validation-results
          path: |
            data/experiments/validation_feature_model_comparison.csv
            data/experiments/validation_feature_model_comparison.json
            data/experiments/next_day_walkforward_search.csv
