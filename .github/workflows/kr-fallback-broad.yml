name: Broad NAVER Korean Fallback Audit

on:
  push:
    branches: [accuracy-lab]
    paths:
      - ".github/workflows/kr-fallback-broad.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Safely verify fallback on 60 sampled Korean stocks
        run: python -m src.kr_fallback_broad_smoke
