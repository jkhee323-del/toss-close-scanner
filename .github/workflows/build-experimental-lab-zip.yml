name: Build TESTED EXPERIMENTAL Lab ZIP (not final V3.1)

on:
  push:
    branches: [lab-us-session-20261108]
    paths:
      - ".github/workflows/build-experimental-lab-zip.yml"
      - "src/**"
      - "tests/**"
      - "pages/**"
      - "app.py"
      - "LAB_BUILD_NOT_FINAL.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install application and regression dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile sources and UI
        run: python -m compileall -q src tests pages app.py
      - name: Run regression test suite before packaging
        run: python -m pytest tests -q
      - name: Record fail-closed release gate status
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set +e
          python -m src.release_gate --project . --output "$RUNNER_TEMP/release_preflight.json"
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected experimental release to be blocked, got exit code $code"
            exit 1
          fi
      - name: Upload release blockers alongside experimental ZIP
        uses: actions/upload-artifact@v4
        with:
          name: scanner-lab-release-blockers
          path: ${{ runner.temp }}/release_preflight.json
          retention-days: 14
      - name: Package the exact tested commit as an experimental archive
        shell: bash
        run: |
          git archive --format=zip --prefix=toss-scanner-experimental-lab/ HEAD > "$RUNNER_TEMP/toss-scanner-experimental-lab.zip"
          test -s "$RUNNER_TEMP/toss-scanner-experimental-lab.zip"
          unzip -t "$RUNNER_TEMP/toss-scanner-experimental-lab.zip" >/dev/null
      - name: Upload experimental lab archive
        uses: actions/upload-artifact@v4
        with:
          name: toss-scanner-EXPERIMENTAL-LAB-NOT-FINAL
          path: ${{ runner.temp }}/toss-scanner-experimental-lab.zip
          retention-days: 14
