name: US Session Lab Regression

on:
  push:
    branches: [lab-us-session-20261108]
    paths:
      - "src/**"
      - "tests/**"
      - "pages/**"
      - ".github/workflows/us-session-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile source and test suite
        run: python -m compileall -q src tests pages app.py
      - name: Run all regression tests
        run: python -m pytest tests -q
