name: Update global market data

on:
  schedule:
    # 08:10 KST, Monday-Friday (23:10 UTC on the previous UTC date).
    # This is after the U.S. regular session close in both DST and standard time.
    - cron: "10 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh global history and candidates
        run: python -m src.auto_update --market global
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/global_history data/global_candidates.csv
          if git diff --cached --quiet; then
            echo "No new global trading data."
          else
            git commit -m "Auto-update global market data"
            git push
          fi
