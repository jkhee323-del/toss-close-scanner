name: Preliminary Long-Term Model Evaluation

on:
  push:
    branches: [accuracy-lab]
    paths:
      - ".github/workflows/long-term-evaluation.yml"
      - "src/long_term_holdout.py"
      - "src/long_term_probability_lab.py"
      - "src/long_term_scanner.py"
      - "src/lab_sampling.py"
      - "tests/test_lab_sampling.py"
      - "tests/test_long_term_holdout.py"
      - "tests/test_long_term_probability_lab.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Experimental 1 3 6 12 month model holdout
        run: python -m src.long_term_probability_lab --max-symbols 80
      - name: Cost-aware top ten ranking holdout
        run: python -m src.long_term_holdout --max-symbols 80 --start 2025-01-01 --top 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preliminary-long-term-evaluation
          path: |
            data/experiments/long_term_probability_lab.csv
            data/experiments/long_term_holdout.csv
            data/experiments/long_term_holdout_matured_summary.csv
