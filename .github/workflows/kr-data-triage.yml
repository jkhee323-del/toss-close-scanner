name: Korean Data Repair Triage

on:
  push:
    branches: [accuracy-lab]
    paths:
      - ".github/workflows/kr-data-triage.yml"
      - "src/data_quality_triage.py"
      - "src/data_integrity_audit.py"
      - "tests/test_data_quality_triage.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "pandas>=2.2,<3" "numpy>=1.26,<3" pytest
      - run: python -m pytest tests/test_data_quality_triage.py -q
      - name: Create actionable Korean source repair inventory
        run: python -m src.data_quality_triage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kr-historical-source-triage
          path: data/experiments/kr_source_quality_triage.csv
