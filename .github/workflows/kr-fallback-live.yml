name: Live Korean NAVER Fallback Smoke

on:
  push:
    branches: [accuracy-lab]
    paths:
      - ".github/workflows/kr-fallback-live.yml"
      - "src/kr_fallback_live_smoke.py"
      - "src/auto_update.py"
      - "src/kr_recent_refresh_guard.py"
      - "src/kr_naver_provider.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_kr_refresh_safety.py tests/test_kr_naver_provider.py -q
      - name: Emulate one missing market session and restore from verified NAVER
        run: python -m src.kr_fallback_live_smoke
