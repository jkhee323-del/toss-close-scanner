name: Next Day Fixed Strategy Retrospective Audit

on:
  push:
    branches: [lab-us-session-20261108]
    paths:
      - ".github/workflows/next-day-fixed-audit-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Evaluate predefined next-day strategy with transaction-cost scenarios
        run: python -m src.next_day_fixed_strategy_audit
      - name: Upload retrospective summaries
        uses: actions/upload-artifact@v4
        with:
          name: next-day-fixed-strategy-research
          path: |
            data/experiments/next_day_fixed_strategy_audit.csv
            data/experiments/next_day_fixed_strategy_daily.csv
            reports/next_day_fixed_strategy_audit.csv
            reports/next_day_fixed_strategy_daily.csv
          if-no-files-found: warn
