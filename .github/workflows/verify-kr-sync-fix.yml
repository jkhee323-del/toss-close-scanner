name: Verify Korean auto-sync workflow fix

on:
  push:
    branches: [fix-kr-cache-sync-20261111]
    paths:
      - "scripts/sync_kr_to_test.sh"
      - "tests/test_kr_sync_workflow.py"
      - ".github/workflows/update-korea.yml"
      - ".github/workflows/verify-kr-sync-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run actual git-based KRX integration scenarios
        run: |
          python -m pip install pytest
          python -m pytest tests/test_kr_sync_workflow.py -q
      - name: Check workflow references tested script
        run: |
          grep -F 'bash scripts/sync_kr_to_test.sh "$updated_main" accuracy-lab' .github/workflows/update-korea.yml
          bash -n scripts/sync_kr_to_test.sh
