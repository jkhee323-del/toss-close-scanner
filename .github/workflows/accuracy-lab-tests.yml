name: Accuracy Lab Tests

on:
  push:
    branches: [accuracy-lab]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/accuracy-lab-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas numpy finance-datareader
      - name: Run scanner regression tests
        run: python -m pytest tests/ -q
