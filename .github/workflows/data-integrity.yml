name: Market Data Integrity Gate

on:
  push:
    branches: [accuracy-lab]
    paths:
      - ".github/workflows/data-integrity.yml"
      - "src/data_integrity_audit.py"
      - "tests/test_data_integrity_audit.py"
      - "src/signals.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "pandas>=2.2,<3" "numpy>=1.26,<3"
      - name: Inspect all saved market histories
        run: python -m src.data_integrity_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-data-integrity-report
          path: data/experiments/data_integrity_audit.json
