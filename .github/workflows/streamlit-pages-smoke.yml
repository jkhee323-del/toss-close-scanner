name: Streamlit Pages Native Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/streamlit-pages-smoke.yml"
      - "tests/test_streamlit_multipage.py"
      - "app.py"
      - "pages/**"
      - "src/long_term_scanner.py"
      - "src/indicators.py"
      - "src/cvd.py"
      - "src/investor_flow.py"
      - "src/investor_flow_import.py"
      - "src/signals.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  streamlit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Execute Streamlit short and long-term pages
        run: python -m pytest tests/test_streamlit_multipage.py -q -s
