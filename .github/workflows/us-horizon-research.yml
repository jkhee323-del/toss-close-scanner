name: US Horizon Research Evaluation

on:
  push:
    branches: [lab-us-session-20261108]
    paths:
      - "src/us_horizon_research.py"
      - ".github/workflows/us-horizon-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Evaluate US horizons without publishing models
        run: |
          python -m src.us_horizon_research --history data/global_history --output-dir reports/us_horizon_research
      - name: Print model evaluation status
        run: |
          python -c "import json; r=json.load(open('reports/us_horizon_research/us_horizon_research.json',encoding='utf-8')); print('Eligible price histories:',r['eligible_price_histories']); print('Horizon statuses:'); [print(h,s['status'],s.get('test_rows','n/a')) for h,s in r['results'].items()]"
      - name: Upload experimental report
        uses: actions/upload-artifact@v4
        with:
          name: us-horizon-research-report
          path: reports/us_horizon_research/us_horizon_research.json
          retention-days: 14
