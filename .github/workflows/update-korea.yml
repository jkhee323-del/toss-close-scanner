name: Update Korea market data

on:
  schedule:
    # 16:35 KST, Monday-Friday (07:35 UTC)
    - cron: "35 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh KRX history
        run: python -m src.auto_update --market kr
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/history; git add data/kr_names.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new KRX trading data."
          else
            git commit -m "Auto-update Korea market data"
            git push
          fi

